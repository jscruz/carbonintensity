name: "Release actions"

on:
  push:
    tags:
      - "*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to PyPi
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm needs full history and tags to derive the version
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install project and test dependencies
        run: pip install -e ".[test]" black build twine

      # Check only — reformatting here would dirty the tree and make
      # setuptools-scm produce a dev version instead of the tag version.
      - run: python3 -m black --check .

      - name: Run tests
        run: python3 -m pytest

      - name: Publish to PyPi
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m build
          twine upload --verbose --skip-existing dist/*
